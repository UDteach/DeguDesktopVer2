name: Build and verify desktop packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all checks (app and package must match the existing version tag)
        type: boolean
        default: false
      tag:
        description: Existing version tag, such as v0.2.1
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify existing release tag has identical app and packaging
        if: inputs.publish == true
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw Error('Tag must match package version')"
          git diff --exit-code "$RELEASE_TAG" -- app package.json package-lock.json docs/QUICKSTART-ja.txt THIRD_PARTY_NOTICES.md
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Windows installer and ZIP
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis zip --x64 --publish never
      - name: Mac DMG and ZIP
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify Windows package bytes
        if: matrix.platform == 'windows'
        run: node scripts/verify-package.mjs
      - name: Verify Mac package bytes
        if: matrix.platform == 'mac'
        run: node scripts/verify-package.mjs --archive=release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/DeguDesktopVer2.app/Contents/Resources/app.asar
      - name: Launch and inspect packaged app
        run: npm run smoke:release
      - name: Verify installer or DMG and extracted ZIP
        run: node scripts/verify-distributions.mjs
      - name: Checksums
        run: node scripts/release-checksums.mjs
      - name: Upload tested artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/DeguDesktopVer2-*.exe
            release/DeguDesktopVer2-*.zip
            release/DeguDesktopVer2-*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .codex/qa/release-*/report.json
            .codex/qa/release-*/settings.png
            .codex/qa/distribution-payload-*/report.json
          if-no-files-found: ignore
          include-hidden-files: true
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts
      - run: node scripts/release-checksums.mjs artifacts
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish && inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/DeguDesktopVer2-* artifacts/SHA256SUMS.txt --verify-tag --title "DeguDesktopVer2 $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
